<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Azure Compute Decision Helper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* STYLES */
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      color: #0f172a;
      background: radial-gradient(circle at top, #e0f2fe 0, #f8fafc 55%, #e5e7eb 100%);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .app {
      max-width: 720px;
      width: 100%;
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 25px 80px rgba(15, 23, 42, 0.15);
      padding: 1.75rem 1.75rem 1.5rem;
      box-sizing: border-box;
    }
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .app-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #0f172a;
    }
    .app-subtitle {
      font-size: 0.875rem;
      color: #6b7280;
      margin-top: 0.25rem;
    }
    .pill {
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      padding: 0.2rem 0.75rem;
      font-size: 0.75rem;
      color: #4b5563;
      background: #f9fafb;
      white-space: nowrap;
    }
    .question-card, .result-card {
      margin-top: 0.75rem;
      border-radius: 1rem;
      border: 1px solid #e5e7eb;
      padding: 1.25rem 1.1rem;
      background: linear-gradient(135deg, #f9fafb, #eff6ff);
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 1rem;
    }
    .question-help {
      font-size: 0.82rem;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .option-btn {
      appearance: none;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 0.6rem 0.9rem;
      text-align: left;
      font-size: 0.92rem;
      background: #ffffff;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      transition: transform 0.08s ease, box-shadow 0.08s ease,
        border-color 0.08s ease, background 0.08s ease;
    }
    .option-btn span.label {
      font-weight: 500;
      color: #111827;
    }
    .option-btn span.meta {
      font-size: 0.78rem;
      color: #6b7280;
    }
    .option-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      border-color: #93c5fd;
      background: #eff6ff;
    }
    .option-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }
    .toolbar {
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }
    .toolbar-left {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .btn {
      appearance: none;
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 0.45rem 0.95rem;
      font-size: 0.85rem;
      cursor: pointer;
      background: #0f172a;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.1s ease, transform 0.08s ease, box-shadow 0.08s ease;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #111827;
      border-color: #e5e7eb;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
      box-shadow: none;
    }
    .btn:not(:disabled):hover {
      background: #111827;
      transform: translateY(-0.5px);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.2);
    }
    .btn-secondary:not(:disabled):hover {
      background: #e5e7eb;
      box-shadow: none;
    }
    .progress-text {
      font-size: 0.78rem;
      color: #6b7280;
    }

    /* Result layout with logos */
    .service-header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 0.6rem;
    }
    .service-logo {
      width: 46px;
      height: 46px;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: white;
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
      background: linear-gradient(145deg, #2563eb, #0ea5e9);
      flex-shrink: 0;
    }
    .service-logo--avs   { background: linear-gradient(145deg, #1d4ed8, #06b6d4); }
    .service-logo--vm    { background: linear-gradient(145deg, #2563eb, #0ea5e9); }
    .service-logo--batch { background: linear-gradient(145deg, #7c3aed, #6366f1); }
    .service-logo--func  { background: linear-gradient(145deg, #f97316, #facc15); }
    .service-logo--app   { background: linear-gradient(145deg, #0ea5e9, #22c55e); }
    .service-logo--aci   { background: linear-gradient(145deg, #0891b2, #38bdf8); }
    .service-logo--sf    { background: linear-gradient(145deg, #ec4899, #a855f7); }
    .service-logo--aro   { background: linear-gradient(145deg, #ef4444, #f97316); }
    .service-logo--aks   { background: linear-gradient(145deg, #2563eb, #3b82f6); }
    .service-logo--aca   { background: linear-gradient(145deg, #0f766e, #22c55e); }
    .service-logo--orch  { background: linear-gradient(145deg, #4b5563, #111827); }

    .result-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0f172a;
    }
    .result-category {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin-top: 0.15rem;
    }
    .result-body {
      font-size: 0.9rem;
      color: #4b5563;
      margin-bottom: 1rem;
      line-height: 1.6;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.25rem;
      margin-bottom: 1rem;
    }
    .chip {
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid #dbeafe;
      background: #eff6ff;
      color: #1d4ed8;
      white-space: nowrap;
    }
    .history-block {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #e5e7eb;
    }
    .history-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .history-item {
      font-size: 0.82rem;
      color: #6b7280;
      display: flex;
      gap: 0.5rem;
    }
    .history-item::before {
      content: "✓";
      color: #22c55e;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .app {
        padding: 1.25rem 1.1rem 1rem;
        border-radius: 1.1rem;
      }
      .app-title {
        font-size: 1.1rem;
      }
      .option-btn {
        font-size: 0.9rem;
      }
      .question-text {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <div class="app-title">Azure Compute Helper</div>
        <div class="app-subtitle">
          Interactive Decision Tree
        </div>
      </div>
      <div class="pill">Image-Verified</div>
    </header>

    <main id="content"></main>

    <footer class="toolbar">
      <div class="toolbar-left">
        <button id="backBtn" class="btn btn-secondary" disabled>
          ◀ Back
        </button>
        <button id="restartBtn" class="btn btn-secondary">
          ⟳ Restart
        </button>
      </div>
      <div class="progress-text" id="progressText"></div>
    </footer>
  </div>

  <script>
    // ============================
    // DATA: Matching the flowchart logic
    // ============================
    const decisionTree = {
      // --- START ---
      "root": {
        type: "question",
        question: "Do you want to build new or migrate?",
        help: "Start at the top of the diagram.",
        options: [
          { label: "Build new", meta: "", next: "q_full_control" },
          { label: "Migrate",   meta: "", next: "q_migrate_type" }
        ]
      },

      // --- MIGRATE BRANCH ---
      "q_migrate_type": {
        type: "question",
        question: "Is this a Lift and Shift, or already optimized?",
        help: "Lift & Shift (down arrow) or Cloud Optimized (right arrow).",
        options: [
          { label: "Lift and Shift",             meta: "", next: "q_lift_containerize" },
          { label: "Already optimized for cloud", meta: "", next: "q_hpc" }
        ]
      },

      // *** CORRECTION: Yes -> q_event_driven (Bypassing HPC) ***
      "q_lift_containerize": {
        type: "question",
        question: "Can it be containerized?",
        help: "Even if it's a migration, can it run in a container?",
        options: [
          { label: "Yes", meta: "", next: "q_event_driven" }, 
          { label: "No",  meta: "", next: "q_cots" }
        ]
      },

      "q_cots": {
        type: "question",
        question: "Commercial off-the-shelf (COTS) app?",
        help: "Is this a vendor app (SAP, Oracle, etc.) or custom code?",
        options: [
          { label: "Yes (COTS)", meta: "", next: "q_vmware_workload" },
          { label: "No (Custom Code)",  meta: "", next: "r_app_service" } 
        ]
      },

      "q_vmware_workload": {
        type: "question",
        question: "VMware workload?",
        help: "Running on vSphere/ESXi today?",
        options: [
          { label: "Yes", meta: "", next: "r_avs" },
          { label: "No",  meta: "", next: "r_vm" }
        ]
      },

      // --- BUILD NEW / SHARED CONTAINER BRANCH ---
      "q_full_control": {
        type: "question",
        question: "Do you require full control?",
        help: "Do you need deep OS access or specific drivers?",
        options: [
          { label: "Yes", meta: "", next: "r_vm" },
          { label: "No",  meta: "", next: "q_hpc" } 
        ]
      },

      "q_hpc": {
        type: "question",
        question: "HPC workload?",
        help: "High-performance computing or large, parallel numerical jobs?",
        options: [
          { label: "Yes", meta: "", next: "r_batch" },
          { label: "No",  meta: "", next: "q_event_driven" }
        ]
      },

      "q_event_driven": {
        type: "question",
        question: "Event-driven workload with short processes?",
        help: "Triggered by HTTP, timers, or messages?",
        options: [
          { label: "Yes", meta: "", next: "r_functions" },
          { label: "No",  meta: "", next: "q_managed_web" }
        ]
      },

      "q_managed_web": {
        type: "question",
        question: "Managed web hosting platform needed?",
        help: "Need built-in scaling, auth, and slots?",
        options: [
          { label: "Yes", meta: "", next: "r_app_service" },
          { label: "No",  meta: "", next: "q_full_orchestration" }
        ]
      },

      "q_full_orchestration": {
        type: "question",
        question: "Need full-fledged orchestration?",
        help: "If No, you get simple containers.",
        options: [
          { label: "Yes", meta: "", next: "q_need_managed_service" },
          { label: "No",  meta: "", next: "r_aci" }
        ]
      },

      "q_need_managed_service": {
        type: "question",
        question: "Need a managed service?",
        help: "Do you want Azure to operate the cluster?",
        options: [
          { label: "Yes", meta: "", next: "q_familiar_sf" },
          { label: "No",  meta: "", next: "r_own_orch" }
        ]
      },

      "q_familiar_sf": {
        type: "question",
        question: "Familiar with Service Fabric / old .NET?",
        help: "Existing Service Fabric knowledge?",
        options: [
          { label: "Yes", meta: "", next: "r_sf" },
          { label: "No",  meta: "", next: "q_using_rh_os" }
        ]
      },

      "q_using_rh_os": {
        type: "question",
        question: "Using Red Hat OpenShift?",
        help: "Standardizing on OpenShift?",
        options: [
          { label: "Yes", meta: "", next: "r_aro" },
          { label: "No",  meta: "", next: "q_need_all_k8s" }
        ]
      },

      "q_need_all_k8s": {
        type: "question",
        question: "Need access to all Kubernetes capabilities?",
        help: "Direct API access, CRDs?",
        options: [
          { label: "Yes", meta: "", next: "r_aks" },
          { label: "No",  meta: "", next: "r_aca" }
        ]
      },

      // --- RESULTS ---
      "r_vm": {
        type: "result",
        code: "VM",
        logoClass: "service-logo--vm",
        title: "Virtual Machines",
        category: "IaaS",
        details: "You manage the OS, runtime, and agents yourself. Use this for maximum flexibility.",
        tags: ["Full control", "Lift and shift"]
      },
      "r_avs": {
        type: "result",
        code: "AVS",
        logoClass: "service-logo--avs",
        title: "Azure VMware Solution",
        category: "Lift and shift",
        details: "Keeps your VMware stack (vCenter, ESXi) on Azure infrastructure.",
        tags: ["VMware", "Hybrid"]
      },
      "r_batch": {
        type: "result",
        code: "BATCH",
        logoClass: "service-logo--batch",
        title: "Azure Batch",
        category: "HPC",
        details: "HPC and large batch workloads with job scheduling.",
        tags: ["HPC", "Parallel jobs"]
      },
      "r_functions": {
        type: "result",
        code: "FUNC",
        logoClass: "service-logo--func",
        title: "Azure Functions",
        category: "Serverless",
        details: "Event-driven, short-lived processes triggered by timers or messages.",
        tags: ["Event-driven", "Pay-per-execution"]
      },
      "r_app_service": {
        type: "result",
        code: "APP",
        logoClass: "service-logo--app",
        title: "Azure App Service",
        category: "PaaS Web",
        details: "Managed web hosting for custom apps or containers. Includes auto-scaling.",
        tags: ["Web apps", "Managed hosting"]
      },
      "r_aci": {
        type: "result",
        code: "ACI",
        logoClass: "service-logo--aci",
        title: "Azure Container Instances",
        category: "Simple Containers",
        details: "Run containers on demand without orchestration.",
        tags: ["No orchestration", "On-demand"]
      },
      "r_sf": {
        type: "result",
        code: "SF",
        logoClass: "service-logo--sf",
        title: "Azure Service Fabric",
        category: "Microservices",
        details: "Distributed systems platform for microservices.",
        tags: ["Service Fabric", ".NET"]
      },
      "r_aro": {
        type: "result",
        code: "ARO",
        logoClass: "service-logo--aro",
        title: "Azure Red Hat OpenShift",
        category: "Managed OpenShift",
        details: "Jointly engineered OpenShift by Microsoft and Red Hat.",
        tags: ["Red Hat", "OpenShift"]
      },
      "r_aks": {
        type: "result",
        code: "AKS",
        logoClass: "service-logo--aks",
        title: "Azure Kubernetes Service",
        category: "Kubernetes",
        details: "Fully managed Kubernetes with full API access.",
        tags: ["K8s", "Full Control"]
      },
      "r_aca": {
        type: "result",
        code: "ACA",
        logoClass: "service-logo--aca",
        title: "Azure Container Apps",
        category: "Serverless Containers",
        details: "Serverless container platform built on K8s but simpler.",
        tags: ["Serverless", "K8s-based"]
      },
      "r_own_orch": {
        type: "result",
        code: "ORCH",
        logoClass: "service-logo--orch",
        title: "Self-Managed Orchestration",
        category: "IaaS",
        details: "Run your own Kubernetes or OpenShift on VMs.",
        tags: ["Self-managed", "Max control"]
      }
    };

    // ============================
    // LOGIC
    // ============================
    let currentNodeId = "root";
    let historyStack = [];

    const contentEl = document.getElementById("content");
    const backBtn = document.getElementById("backBtn");
    const restartBtn = document.getElementById("restartBtn");
    const progressText = document.getElementById("progressText");

    render();

    backBtn.addEventListener("click", () => {
      if (historyStack.length > 0) {
        const prev = historyStack.pop();
        currentNodeId = prev.nodeId;
        render();
      }
    });

    restartBtn.addEventListener("click", () => {
      currentNodeId = "root";
      historyStack = [];
      render();
    });

    function render() {
      const node = decisionTree[currentNodeId];
      if (!node) { contentEl.innerHTML = "<p>Error: Unknown node.</p>"; return; }

      backBtn.disabled = historyStack.length === 0;
      progressText.textContent = `Step ${historyStack.length + 1}`;
      contentEl.innerHTML = "";
      
      if (node.type === "question") {
        renderQuestion(node);
      } else {
        renderResult(node);
      }
    }

    function renderQuestion(node) {
      const optionsHtml = node.options.map((opt, index) => `
          <button class="option-btn" data-index="${index}">
            <span class="label">${opt.label}</span>
            <span class="meta">${opt.meta || ""}</span>
          </button>`).join("");

      contentEl.innerHTML = `
        <div class="question-card">
          <div class="question-text">${node.question}</div>
          <div class="question-help">${node.help}</div>
          <div class="options">${optionsHtml}</div>
        </div>`;

      contentEl.querySelectorAll(".option-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const index = btn.getAttribute("data-index");
          const selectedOption = node.options[index];
          historyStack.push({
            nodeId: currentNodeId,
            questionText: node.question,
            answerLabel: selectedOption.label
          });
          currentNodeId = selectedOption.next;
          render();
        });
      });
    }

    function renderResult(node) {
      const tagsHtml = node.tags.map(t => `<span class="chip">${t}</span>`).join("");
      const historyHtml = historyStack.map(h => `<div class="history-item"><span>${h.answerLabel}</span></div>`).join("");

      contentEl.innerHTML = `
        <div class="result-card">
          <div class="service-header">
             <div class="service-logo ${node.logoClass}">${node.code}</div>
             <div>
               <div class="result-title">${node.title}</div>
               <div class="result-category">${node.category}</div>
             </div>
          </div>
          <div class="chip-row">${tagsHtml}</div>
          <div class="result-body">${node.details}</div>
          <div class="history-block">
             <div class="history-title">Path Taken</div>
             <div class="history-list">${historyHtml}</div>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
